name: Build Tadbeer for macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional existing release tag to attach the DMG to"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: tadbeer-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Build macOS app
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron-builder
          key: mac-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mac-electron-builder-

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package macOS app
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: Tadbeer-macOS
          path: release/*.dmg
          if-no-files-found: warn
          retention-days: 14

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/*.dmg
